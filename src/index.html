<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' http://127.0.0.1:3000 https://api.csrestored.fun https://cdn.csrestored.fun https://socket.csrestored.fun wss://socket.csrestored.fun;">
  <title>CSR Launcher</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Bar -->
    <header class="topbar" id="topbar">
      <div class="topbar-logo">
        <span>CS:<span class="logo-red">R</span></span>
      </div>
      <div class="topbar-right">
        <div class="topbar-user-menu" id="topbar-user-menu" style="display: none;">
          <div class="topbar-user" id="topbar-user">
            <div style="position: relative;">
              <img class="topbar-user-avatar" id="topbar-avatar" src="" alt="Avatar">
              <div class="topbar-user-unverified" id="topbar-unverified" style="display: none;">
                <i class="fa-solid fa-circle"></i>
              </div>
            </div>
            <span class="topbar-user-name" id="topbar-name"></span>
          </div>
          <div class="topbar-user-dropdown">
            <button class="btn-logout" id="btn-logout" type="button">
              <i class="fa-solid fa-right-from-bracket"></i>
              <span data-i18n="btn_logout"></span>
            </button>
          </div>
        </div>
        <button class="btn-auth-login" id="btn-login" style="margin: 0; padding: 8px 16px;">
          <i class="fa-brands fa-discord"></i>
          <span data-i18n="btn_login"></span>
        </button>
      </div>
    </header>

    <div class="main-content">
      <!-- Sidebar -->
      <aside class="sidebar">
        <nav class="sidebar-nav">
          <a href="#" class="nav-item active" data-page="home">
            <i class="fa-solid fa-house"></i>
            <span data-i18n="nav_home"></span>
          </a>
          <a href="#" class="nav-item" data-page="matchmaking">
            <i class="fa-solid fa-crosshairs"></i>
            <span data-i18n="nav_matchmaking"></span>
          </a>
          <a href="#" class="nav-item" data-page="leaderboard">
            <i class="fa-solid fa-chart-column"></i>
            <span data-i18n="nav_leaderboard"></span>
          </a>
          <a href="#" class="nav-item" data-page="inventory">
            <i class="fa-solid fa-briefcase"></i>
            <span data-i18n="nav_inventory"></span>
          </a>
          <a href="#" class="nav-item" data-page="friends">
            <i class="fa-solid fa-user-group"></i>
            <span data-i18n="nav_friends"></span>
          </a>
          <a href="#" class="nav-item" data-page="history">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span data-i18n="nav_history"></span>
          </a>
          <a href="#" class="nav-item" data-page="settings">
            <i class="fa-solid fa-gear"></i>
            <span data-i18n="nav_settings"></span>
          </a>
        </nav>
      </aside>

      <!-- Content -->
      <main class="content">
        <!-- Home Page -->
        <div class="page active" id="page-home">
          <div class="hero-section">
            <div class="hero-bg"></div>
            <div class="hero-content">
              <h1 data-i18n="hero_title"></h1>
              <p data-i18n="hero_subtitle"></p>
            </div>
          </div>
        </div>

        <!-- Matchmaking Page -->
        <div class="page" id="page-matchmaking">
          <div class="mm-page">
            <div class="mm-coming-soon" id="mm-coming-soon" style="display: none;">
              <div class="mm-coming-soon-inner">
                <i class="fa-solid fa-crosshairs"></i>
                <h2 data-i18n="mm_coming_soon_title"></h2>
                <p data-i18n="mm_coming_soon_body"></p>
              </div>
            </div>
            <div class="stats-loading" id="mm-loading">
              <i class="fa-solid fa-spinner fa-spin"></i>
              <p data-i18n="mm_connecting"></p>
            </div>
            <div id="mm-error" class="mm-error" style="display: none;"></div>
            <div id="mm-content" style="display: none;">
              <div class="mm-team-header">
                <div class="mm-team-header-left">
                  <h2 class="mm-group-name" id="mm-group-name">—</h2>
                  <div class="mm-invited-row" id="mm-invited-row" style="display: none;"></div>
                </div>
                <button type="button" class="btn-secondary mm-leave-btn" id="mm-leave-group">
                  <span data-i18n="mm_leave_group"></span>
                </button>
              </div>

              <div class="mm-team-slots" id="mm-team-slots"></div>
              <p class="mm-lobby-sync-hint" id="mm-lobby-sync-hint" style="display: none;"></p>

              <div class="mm-queue-panel">
                <div class="mm-elo-badge" id="mm-elo-badge">— ELO</div>
                <button type="button" class="btn-play mm-queue-btn" id="mm-queue-btn" disabled>
                  <span data-i18n="mm_join_queue"></span>
                </button>
                <p class="mm-stats-line" id="mm-stats-line"></p>
                <p class="mm-promo">🔥 2x COINS WEEK</p>
              </div>

              <div class="mm-options card">
                <div class="mm-options-header">
                  <h3 data-i18n="mm_options"></h3>
                </div>
                <div class="mm-options-grid">
                  <div class="mm-options-col">
                    <h4 data-i18n="mm_game_mode"></h4>
                    <div class="mm-option-list" id="mm-mode-list"></div>
                  </div>
                  <div class="mm-options-col">
                    <h4 data-i18n="mm_server_location"></h4>
                    <div class="mm-option-list" id="mm-region-list"></div>
                  </div>
                </div>
              </div>

              <div class="mm-live card">
                <h3 data-i18n="mm_live_matches"></h3>
                <div class="mm-live-box">
                  <div class="stats-table-wrap mm-live-table-wrap">
                    <table class="stats-table mm-live-table">
                      <thead>
                        <tr>
                          <th data-i18n="mm_col_mode"></th>
                          <th data-i18n="mm_col_map"></th>
                          <th colspan="2" data-i18n="mm_col_score"></th>
                          <th data-i18n="mm_col_duration"></th>
                          <th data-i18n="mm_col_region"></th>
                        </tr>
                      </thead>
                      <tbody id="mm-live-body"></tbody>
                    </table>
                  </div>
                  <p class="mm-live-empty" id="mm-live-empty" data-i18n="mm_no_live_matches"></p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Leaderboard Page -->
        <div class="page" id="page-leaderboard">
          <div class="page-header stats-page-header leaderboard-page-header">
            <h2 data-i18n="page_leaderboard_title"></h2>
            <div class="leaderboard-search-bar">
              <i class="fa-solid fa-magnifying-glass leaderboard-search-icon" aria-hidden="true"></i>
              <input type="search" id="leaderboard-search" autocomplete="off" spellcheck="false"
                data-i18n-placeholder="stats_leaderboard_search_placeholder"
                placeholder="Search username or user ID…">
              <button type="button" class="leaderboard-search-clear" id="leaderboard-search-clear"
                aria-label="Clear search" hidden>
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
              </button>
              <span class="leaderboard-count-badge" id="leaderboard-count"></span>
            </div>
            <button class="btn-secondary" id="btn-refresh-leaderboard">
              <i class="fa-solid fa-rotate"></i>
              <span data-i18n="btn_refresh"></span>
            </button>
          </div>
          <div class="stats-loading" id="leaderboard-loading" style="display: none;">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <p data-i18n="stats_loading"></p>
          </div>
          <div class="stats-table-wrap">
            <table class="stats-table leaderboard-table">
              <thead>
                <tr>
                  <th data-i18n="stats_col_rank"></th>
                  <th data-i18n="stats_col_username"></th>
                  <th data-i18n="stats_col_matches"></th>
                  <th data-i18n="stats_col_wins"></th>
                  <th data-i18n="stats_col_elo"></th>
                </tr>
              </thead>
              <tbody id="leaderboard-body"></tbody>
            </table>
          </div>
          <div class="stats-load-more-wrap">
            <button type="button" class="btn-load-more" id="btn-leaderboard-load-more" style="display: none;">
              <span data-i18n="stats_load_more">Load More</span>
            </button>
          </div>
        </div>

        <!-- Inventory Page -->
        <div class="page" id="page-inventory">
          <div class="inventory-view-banner" id="inventory-view-banner" hidden>
            <button type="button" class="btn-secondary" id="btn-inventory-view-back">
              <i class="fa-solid fa-arrow-left"></i>
              <span data-i18n="profile_back"></span>
            </button>
            <span class="inventory-view-label" id="inventory-view-label"></span>
          </div>
          <div class="page-header">
            <h2 data-i18n="page_inventory_title" id="page-inventory-title"></h2>
          </div>
          <div class="inventory-controls">
            <button class="btn-secondary" id="btn-refresh-inventory">
              <i class="fa-solid fa-rotate"></i>
              <span data-i18n="btn_refresh"></span>
            </button>
            <span class="inventory-count" id="inventory-count"></span>
            <div class="inventory-coins-wrap" id="inventory-coins-wrap" hidden>
              <span class="inventory-coins-label" data-i18n="inventory_your_coins">Your coins</span>
              <span class="inventory-coins-badge">
                <i class="fa-solid fa-coins inventory-coins-icon" aria-hidden="true"></i>
                <span class="inventory-coins-value" id="inventory-coins-value"></span>
              </span>
            </div>
          </div>
          <div class="inventory-toolbar" id="inventory-toolbar" style="display: none;">
            <div class="inventory-toolbar-row">
              <input type="search" id="inv-search" autocomplete="off" spellcheck="false"
                data-i18n-placeholder="inv_search_placeholder" placeholder="Search weapon or skin…">
              <div class="inventory-filters">
                <select id="inv-type" title="Type"></select>
                <select id="inv-rarity" title="Rarity"></select>
                <select id="inv-wear" title="Wear">
                  <option value="" data-i18n="inv_all_wear">All wear</option>
                  <option value="FN" data-i18n="inv_wear_fn">Factory New</option>
                  <option value="MW" data-i18n="inv_wear_mw">Minimal Wear</option>
                  <option value="FT" data-i18n="inv_wear_ft">Field-Tested</option>
                  <option value="WW" data-i18n="inv_wear_ww">Well-Worn</option>
                  <option value="BS" data-i18n="inv_wear_bs">Battle-Scarred</option>
                </select>
                <select id="inv-phase" title="Doppler phase">
                  <option value="" data-i18n="inv_all_phases">All phases</option>
                  <option value="__phase__" data-i18n="inv_any_phase">Phased only</option>
                  <option value="__gems__" data-i18n="inv_gems_only">Gems only</option>
                  <option value="ruby" data-i18n="inv_pattern_ruby">Ruby</option>
                  <option value="sapphire" data-i18n="inv_pattern_sapphire">Sapphire</option>
                  <option value="bp" data-i18n="inv_pattern_bp">Black Pearl</option>
                  <option value="emerald" data-i18n="inv_pattern_emerald">Emerald</option>
                  <option value="p1" data-i18n="inv_pattern_p1">Phase 1</option>
                  <option value="p2" data-i18n="inv_pattern_p2">Phase 2</option>
                  <option value="p3" data-i18n="inv_pattern_p3">Phase 3</option>
                  <option value="p4" data-i18n="inv_pattern_p4">Phase 4</option>
                </select>
                <select id="inv-ch" title="CH tier">
                  <option value="" data-i18n="inv_all_ch">All Case Hardened</option>
                  <option value="__ch__" data-i18n="inv_ch_tiered">CH tiered only</option>
                  <option value="ch0" data-i18n="inv_ch_rank1">#1 Blue</option>
                  <option value="ch1" data-i18n="inv_ch_t1">T1 Blue</option>
                  <option value="ch2" data-i18n="inv_ch_t2">T2 Blue</option>
                  <option value="ch3" data-i18n="inv_ch_t3">T3 Blue</option>
                  <option value="gold0" data-i18n="inv_ch_gold_rank1">#1 Gold</option>
                  <option value="gold1" data-i18n="inv_ch_gold_t1">G1 Gold</option>
                  <option value="gold2" data-i18n="inv_ch_gold_t2">G2 Gold</option>
                  <option value="gold3" data-i18n="inv_ch_gold_t3">G3 Gold</option>
                </select>
                <select id="inv-float-sort" title="Float">
                  <option value="" data-i18n="inv_float_order">Float order</option>
                  <option value="asc" data-i18n="inv_float_asc">Float: Low → High</option>
                  <option value="desc" data-i18n="inv_float_desc">Float: High → Low</option>
                </select>
                <button type="button" class="btn-secondary btn-inv-clear" id="inv-clear" data-i18n="inv_clear">Clear</button>
              </div>
            </div>
            <div class="inventory-filter-count" id="inv-filter-count"></div>
          </div>
          <div class="inventory-loading" id="inventory-loading" style="display: none;">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <p data-i18n="inventory_loading"></p>
          </div>
          <div class="inventory-grid" id="inventory-grid">
            <div class="empty-state">
              <i class="fa-solid fa-briefcase"></i>
              <p data-i18n="inventory_empty_login"></p>
            </div>
          </div>
          <div class="inv-load-more-wrap stats-load-more-wrap" id="inv-load-more-wrap" style="display: none;">
            <button type="button" class="btn-load-more" id="btn-inventory-load-more">
              <span data-i18n="inv_load_more">Load More</span>
            </button>
          </div>
        </div>

        <!-- Friends Page -->
        <div class="page" id="page-friends">
          <div class="page-header friends-page-header">
            <h2 data-i18n="page_friends_title"></h2>
            <div class="friends-toolbar">
              <input type="search" id="friends-search" autocomplete="off" spellcheck="false"
                data-i18n-placeholder="friends_search_placeholder" placeholder="Username">
              <button type="button" class="btn-secondary" id="btn-friends-invite">
                <span data-i18n="friends_invite_btn">Invite +</span>
              </button>
              <button type="button" class="btn-secondary" id="btn-refresh-friends">
                <i class="fa-solid fa-rotate"></i>
                <span data-i18n="btn_refresh"></span>
              </button>
            </div>
          </div>
          <div class="stats-loading" id="friends-loading" style="display: none;">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <p data-i18n="stats_loading"></p>
          </div>
          <div class="friends-list" id="friends-list"></div>
        </div>

        <!-- History Page -->
        <div class="page" id="page-history">
          <div class="page-header stats-page-header">
            <h2 data-i18n="page_history_title"></h2>
            <button class="btn-secondary" id="btn-refresh-history">
              <i class="fa-solid fa-rotate"></i>
              <span data-i18n="btn_refresh"></span>
            </button>
          </div>
          <div class="stats-loading" id="history-loading" style="display: none;">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <p data-i18n="stats_loading"></p>
          </div>
          <div class="history-list" id="history-list"></div>
        </div>

        <!-- Player Profile -->
        <div class="page" id="page-profile">
          <div class="profile-page">
            <div class="profile-top-bar">
              <button type="button" class="btn-secondary" id="btn-profile-back">
                <i class="fa-solid fa-arrow-left"></i>
                <span data-i18n="profile_back"></span>
              </button>
              <a class="profile-site-link" id="profile-site-link" href="#" target="_blank" rel="noopener">
                <span data-i18n="profile_open_site"></span>
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
              </a>
            </div>
            <div class="stats-loading" id="profile-loading">
              <i class="fa-solid fa-spinner fa-spin"></i>
              <p data-i18n="profile_loading"></p>
            </div>
            <div id="profile-error" class="profile-error" style="display: none;"></div>
            <div id="profile-content" style="display: none;">
              <div class="profile-header card">
                <div class="profile-header-main">
                  <img class="profile-avatar" id="profile-avatar" alt="">
                  <div class="profile-header-info">
                    <h2 class="profile-name" id="profile-name"></h2>
                    <p class="profile-elo" id="profile-elo"></p>
                    <div class="profile-links" id="profile-links"></div>
                  </div>
                </div>
                <button type="button" class="btn-primary profile-inv-btn" id="btn-profile-inventory">
                  <i class="fa-solid fa-briefcase"></i>
                  <span data-i18n="profile_watch_inventory"></span>
                </button>
              </div>
              <section class="profile-section">
                <h3 class="profile-section-title" data-i18n="profile_statistics"></h3>
                <div class="profile-stat-grid" id="profile-stat-grid"></div>
              </section>
              <section class="profile-section">
                <h3 class="profile-section-title" data-i18n="page_history_title"></h3>
                <div class="stats-table-wrap profile-history-wrap">
                  <table class="stats-table profile-history-table">
                    <thead>
                      <tr>
                        <th data-i18n="stats_col_date"></th>
                        <th data-i18n="stats_col_score"></th>
                        <th data-i18n="stats_col_kda"></th>
                        <th data-i18n="stats_col_kdr"></th>
                        <th data-i18n="stats_col_map"></th>
                      </tr>
                    </thead>
                    <tbody id="profile-history-body"></tbody>
                  </table>
                </div>
                <p class="profile-empty" id="profile-history-empty" style="display: none;"></p>
                <div class="stats-load-more-wrap profile-load-more-wrap" id="profile-load-more-wrap" style="display: none;">
                  <button type="button" class="btn-load-more" id="btn-profile-load-more">
                    <span data-i18n="profile_load_more"></span>
                  </button>
                </div>
              </section>
            </div>
          </div>
        </div>

        <!-- Live Match (matchmaking flow) -->
        <div class="page" id="page-live-match">
          <div class="page-header stats-page-header">
            <button type="button" class="btn-secondary" id="btn-live-match-back">
              <i class="fa-solid fa-arrow-left"></i>
              <span data-i18n="live_match_back"></span>
            </button>
          </div>
          <div id="live-match-root" class="live-match-page"></div>
        </div>

        <!-- Match Detail (sub-view) -->
        <div class="page" id="page-match-detail">
          <div class="page-header stats-page-header">
            <button type="button" class="btn-secondary" id="btn-match-back">
              <i class="fa-solid fa-arrow-left"></i>
              <span data-i18n="stats_back_history"></span>
            </button>
          </div>
          <div id="match-detail-content"></div>
        </div>

        <!-- Settings Page -->
        <div class="page" id="page-settings">
          <div class="page-header">
            <h2 data-i18n="page_settings_title"></h2>
          </div>
          <div class="settings-grid">
            <div class="card">
              <div class="card-header">
                <i class="fa-solid fa-folder-open"></i>
                <h3 data-i18n="settings_game_folder_title"></h3>
              </div>
              <div class="card-body">
                <div class="input-group">
                  <label for="csgo-dir" data-i18n="settings_game_folder_label"></label>
                  <div class="input-with-btn">
                    <input type="text" id="csgo-dir" placeholder="C:\Games\CSRestored">
                    <button class="btn-secondary" id="btn-browse-dir">
                      <i class="fa-solid fa-folder"></i>
                    </button>
                  </div>
                  <p class="input-hint" data-i18n="settings_game_folder_hint"></p>
                </div>
              </div>
            </div>

            <div class="card">
              <div class="card-header">
                <i class="fa-solid fa-terminal"></i>
                <h3 data-i18n="settings_launch_title"></h3>
              </div>
              <div class="card-body">
                <div class="input-group">
                  <label for="launch-args" data-i18n="settings_launch_label"></label>
                  <input type="text" id="launch-args" placeholder="-novid -console -language japanese">
                  <p class="input-hint" data-i18n="settings_launch_hint"></p>
                </div>
              </div>
            </div>

            <div class="card">
              <div class="card-header">
                <i class="fa-solid fa-language"></i>
                <h3 data-i18n="settings_language_label"></h3>
              </div>
              <div class="card-body">
                <div class="input-group">
                  <select id="language-select"></select>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Bottom Bar -->
    <footer class="bottombar">
      <div class="bottombar-actions">
        <p class="launch-hint" id="launch-hint" style="display: none;" data-i18n="launch_close_hint"></p>
        <button class="btn-play" id="btn-launch-game">
          <i class="fa-solid fa-play"></i>
          <span class="play-text" data-i18n="btn_launch"></span>
        </button>
      </div>
    </footer>
  </div>

  <!-- Group invite toasts -->
  <div class="mm-group-invites" id="mm-group-invites"></div>

  <!-- Match accept modal -->
  <div class="mm-accept-overlay" id="mm-accept-modal">
    <div class="mm-accept-panel card">
      <div id="mm-accept-body"></div>
    </div>
  </div>

  <!-- Invite friends modal -->
  <div class="mm-invite-overlay" id="mm-invite-modal">
    <div class="mm-invite-panel card">
      <div class="mm-invite-header">
        <h3 data-i18n="mm_invite_title"></h3>
        <button type="button" class="mm-invite-close" id="mm-invite-close" aria-label="Close">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="mm-invite-search-wrap">
        <input type="search" id="mm-invite-search" autocomplete="off" spellcheck="false"
          data-i18n-placeholder="mm_invite_search" placeholder="Search…">
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>
      <div class="mm-invite-list" id="mm-invite-list"></div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-install">
    <div class="modal">
      <div class="modal-header">
        <h3><i class="fa-solid fa-download"></i> <span data-i18n="modal_update_title"></span></h3>
      </div>
      <div class="modal-body">
        <div class="install-progress" id="install-progress">
          <div class="progress-spinner">
            <i class="fa-solid fa-spinner fa-spin"></i>
          </div>
          <div class="progress-status" id="progress-status"></div>
          <div class="progress-bar-container">
            <div class="progress-bar-fill" id="modal-progress-fill"></div>
          </div>
